<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>录入交易</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        label { display: block; margin: 12px 0 4px; font-weight: 600; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; background: #333; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>录入交易</h1>
    <form action="/portfolio/add" method="post">
        <label>股票代码 Symbol</label>
        <input name="symbol" required>

        <label>操作 Action</label>
        <select name="action">
            <option value="buy">买入 Buy</option>
            <option value="sell">卖出 Sell</option>
            <option value="drip">分红再投 DRIP</option>
        </select>

        <label>成交单价 Price</label>
        <input name="price" type="number" step="any" required>

        <label>数量 Quantity</label>
        <input name="quantity" type="number" step="any" required>

        <label>成交日期 Date</label>
        <input name="trade_date" type="date" required>

        <label>币种 Currency</label>
        <select name="currency">
            <option value="CAD">CAD</option>
            <option value="USD">USD</option>
        </select>

        <label>账户 Account</label>
        <input name="account" placeholder="TFSA">

        <button type="submit">保存</button>
    </form>
</body>
</html>
